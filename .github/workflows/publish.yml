name: Publish GK Reels Hindi

on:
  schedule:
    # 2 videos/day with automatic retry backup triggers if GitHub delays runner queues:
    # Morning Slot:
    #   - Primary: 07:59 AM IST (02:29 UTC)
    #   - Retry 1: 08:29 AM IST (02:59 UTC)
    #   - Retry 2: 08:59 AM IST (03:29 UTC)
    - cron: "29 2 * * *"
    - cron: "59 2 * * *"
    - cron: "29 3 * * *"
    # Evening Slot:
    #   - Primary: 05:28 PM IST (11:58 UTC)
    #   - Retry 1: 05:58 PM IST (12:28 UTC)
    #   - Retry 2: 06:28 PM IST (12:58 UTC)
    - cron: "58 11 * * *"
    - cron: "28 12 * * *"
    - cron: "58 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish (bypass daily quota)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-indic

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline (render + upload)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_PUBLISH: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/run_pipeline.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gk-reels-hindi-video
          path: output/*.mp4
          retention-days: 7

      - name: Commit updated state
        run: |
          git config user.name "gk-reels-hindi-bot"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Advance question index [skip ci]"
          git push
